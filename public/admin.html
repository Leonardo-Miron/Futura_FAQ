<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Administración · Centro de Ayuda Futura</title>
<style>
  :root{--brand:#0f766e;--brand-dark:#115e59;--brand-light:#ccfbf1;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--bg:#f1f5f9;--card:#fff;--danger:#dc2626;--ok:#059669;--draft:#d97706}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
  button{font-family:inherit;cursor:pointer}
  a{color:var(--brand)}
  /* Login */
  #login{max-width:360px;margin:9vh auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:30px;box-shadow:0 8px 30px rgba(15,23,42,.08)}
  #login h1{font-size:20px;margin:0 0 4px}#login p{color:var(--muted);font-size:14px;margin:0 0 20px}
  #login .mark{width:40px;height:40px;border-radius:10px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:800;font-size:20px;margin-bottom:14px}
  label{display:block;font-size:13px;font-weight:600;margin:12px 0 5px}
  input[type=text],input[type=password],textarea,select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px;font-family:inherit;background:#fff}
  textarea{resize:vertical}
  .btn{background:var(--brand);color:#fff;border:none;border-radius:8px;padding:10px 16px;font-size:14px;font-weight:600}
  .btn:hover{background:var(--brand-dark)}
  .btn.sec{background:#fff;color:var(--ink);border:1px solid var(--line)}
  .btn.sec:hover{border-color:var(--brand);color:var(--brand)}
  .btn.danger{background:#fff;color:var(--danger);border:1px solid #fecaca}
  .btn.danger:hover{background:#fef2f2}
  .btn.sm{padding:5px 10px;font-size:12.5px}
  .err{color:var(--danger);font-size:13px;margin-top:10px;min-height:18px}
  /* App shell */
  header.top{background:var(--brand-dark);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:12px 20px}
  header.top .l{display:flex;align-items:center;gap:10px;font-weight:700}
  header.top .mark{width:30px;height:30px;border-radius:8px;background:#fff;color:var(--brand);display:grid;place-items:center;font-weight:800}
  header.top .r{display:flex;align-items:center;gap:14px;font-size:13.5px}
  header.top a{color:#fff}
  .wrap{display:grid;grid-template-columns:340px 1fr;gap:0;min-height:calc(100vh - 54px)}
  .side{background:#fff;border-right:1px solid var(--line);overflow-y:auto;max-height:calc(100vh - 54px)}
  .side .tools{padding:12px;border-bottom:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
  .cat-h{padding:10px 12px;font-weight:700;font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:6px;border-top:1px solid var(--line);background:#f8fafc}
  .cat-h .mv{color:var(--muted)}
  .sec-h{padding:6px 12px 6px 18px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
  .art{padding:8px 12px 8px 24px;font-size:13.5px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px solid #f1f5f9}
  .art:hover{background:#f8fafc}
  .art.active{background:var(--brand-light)}
  .art .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .badge{font-size:10px;font-weight:700;padding:1px 6px;border-radius:20px;flex:none}
  .badge.pub{background:#d1fae5;color:var(--ok)}
  .badge.draft{background:#fef3c7;color:var(--draft)}
  .mvbtns{display:flex;gap:2px}
  .mvbtns button{border:none;background:transparent;color:var(--muted);font-size:12px;padding:0 3px}
  /* Editor */
  .main{padding:22px 26px;overflow-y:auto;max-height:calc(100vh - 54px)}
  .empty{color:var(--muted);text-align:center;margin-top:14vh}
  .ed-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
  .ed-head h2{margin:0;font-size:18px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .toolbar{display:flex;flex-wrap:wrap;gap:4px;border:1px solid var(--line);border-bottom:none;border-radius:8px 8px 0 0;padding:6px;background:#f8fafc}
  .toolbar button{border:1px solid transparent;background:#fff;border-radius:6px;padding:5px 9px;font-size:13px}
  .toolbar button:hover{border-color:var(--line)}
  .editor{border:1px solid var(--line);border-radius:0 0 8px 8px;min-height:280px;padding:14px 16px;background:#fff;font-size:15px;overflow-y:auto;max-height:52vh}
  .editor:focus{outline:2px solid var(--brand-light)}
  .editor table{border-collapse:collapse;width:100%;margin:8px 0}.editor th,.editor td{border:1px solid var(--line);padding:6px 9px}
  .editor .callout{background:var(--brand-light);border-left:4px solid var(--brand);border-radius:8px;padding:10px 14px;margin:8px 0}
  .editor .ph{background:#fef9c3;border:1px dashed #facc15;color:#854d0e;border-radius:6px;padding:1px 6px}
  .htmlarea{width:100%;min-height:280px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;border-radius:0 0 8px 8px;border:1px solid var(--line);border-top:none;padding:12px}
  .savebar{position:sticky;bottom:0;background:var(--bg);padding:14px 0 4px;display:flex;gap:10px;align-items:center;margin-top:14px}
  .savedmsg{color:var(--ok);font-size:13px;font-weight:600}
  .hint{color:var(--muted);font-size:12.5px;margin-top:4px}
  .hidden{display:none}
  dialog{border:none;border-radius:12px;padding:0;box-shadow:0 20px 60px rgba(0,0,0,.25);max-width:420px;width:92%}
  dialog .dlg{padding:22px}dialog h3{margin:0 0 14px;font-size:16px}
  dialog::backdrop{background:rgba(15,23,42,.4)}
</style>
</head>
<body>

<div id="login">
  <div class="mark">F</div>
  <h1>Administración</h1>
  <p>Centro de Ayuda · Futura Labs</p>
  <label>Usuario</label>
  <input type="text" id="u" autocomplete="username">
  <label>Contraseña</label>
  <input type="password" id="p" autocomplete="current-password">
  <div style="margin-top:16px"><button class="btn" style="width:100%" onclick="doLogin()">Ingresar</button></div>
  <div class="err" id="loginErr"></div>
</div>

<div id="app" class="hidden">
  <header class="top">
    <div class="l"><span class="mark">F</span> Futura Help · Administración</div>
    <div class="r">
      <span id="who"></span>
      <a href="/" target="_blank">Ver sitio ↗</a>
      <a onclick="editContact()" style="cursor:pointer">Contacto</a>
      <button class="btn sec sm" onclick="logout()">Salir</button>
    </div>
  </header>
  <div class="wrap">
    <div class="side">
      <div class="tools">
        <button class="btn sm" onclick="newCategory()">+ Categoría</button>
        <button class="btn sm sec" onclick="reloadTree()">↻ Recargar</button>
      </div>
      <div id="tree"></div>
    </div>
    <div class="main" id="main">
      <div class="empty">Selecciona un artículo del panel izquierdo, o crea uno nuevo.</div>
    </div>
  </div>
</div>

<dialog id="dlg"><div class="dlg" id="dlgContent"></div></dialog>

<script src="/admin.js"></script>
</body>
</html>
